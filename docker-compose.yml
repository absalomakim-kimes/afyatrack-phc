services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: afyatrack
      POSTGRES_USER: afyatrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afyatrack -d afyatrack"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://afyatrack:${POSTGRES_PASSWORD}@db:5432/afyatrack
      COOKIE_SECURE: "1"
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  postgres_data:
